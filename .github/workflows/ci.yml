name: Simulation Dashboard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  source-hygiene:
    name: Source hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check diff whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]] && git cat-file -e "${PR_BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "${PR_BASE_SHA}...HEAD"
          elif [[ "${PUSH_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]] && git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "${PUSH_BEFORE_SHA}..HEAD"
          else
            git show --check --format= HEAD
          fi
      - name: Validate shell syntax and LF line endings
        shell: bash
        run: |
          git ls-files -z -- '*.sh' | xargs -0 -r -n1 bash -n
          if git grep -Il $'\r' -- '*.sh'; then
            echo 'Shell scripts must use LF line endings.' >&2
            exit 1
          fi

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
      - name: Check backend architecture boundaries
        env:
          PYTHONPATH: .
        run: python scripts/check_architecture.py
      - name: Verify checked-in OpenAPI snapshot matches backend
        env:
          PYTHONPATH: .
        run: python scripts/check_openapi_contract.py --expected ../frontend/openapi.json
      - name: Run unit tests without database bootstrap
        env:
          PYTHONPATH: .
        run: python -m pytest -q -m unit
      - name: Run API and adapter contract tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q -m "contract and not postgres_integration"
      - name: Run DuckDB adapter regression tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q -m "duckdb_integration and not contract and not postgres_integration"
      - name: Verify PostgreSQL schema export is current
        run: python scripts/export_postgres_schema.py
      - name: Check generated PostgreSQL schema
        working-directory: .
        run: git diff --exit-code backend/migrations/schema.sql

  postgres-integration:
    name: PostgreSQL 18 integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-test
          POSTGRES_DB: simulation_dashboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d simulation_dashboard_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      ANALYSIS_DB_BACKEND: postgresql
      PYTHONPATH: .
      POSTGRES_ADMIN_URL: postgresql://postgres:postgres-test@127.0.0.1:5432/postgres
      SIM_DASH_DATABASE: simulation_dashboard_test
      SIM_DASH_OWNER_ROLE: simdashboard_owner
      SIM_DASH_APP_ROLE: simdashboard_app
      SIM_DASH_OWNER_PASSWORD: owner-test-password
      SIM_DASH_APP_PASSWORD: app-test-password
      POSTGRES_MAX_CONNECTIONS: "100"
      POSTGRES_RESERVED_CONNECTIONS: "10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install backend dependencies
        run: python -m pip install -r requirements.lock
      - name: Bootstrap least-privilege roles
        run: python scripts/bootstrap_postgres.py
      - name: Verify PostgreSQL connection pool budget
        run: python scripts/check_postgres_pool_budget.py
      - name: Apply Alembic migrations
        env:
          DATABASE_URL: postgresql+psycopg://simdashboard_owner:owner-test-password@127.0.0.1:5432/simulation_dashboard_test
        run: python -m alembic -c alembic.ini upgrade head
      - name: Harden append-only audit privileges
        env:
          DATABASE_URL: postgresql+psycopg://simdashboard_owner:owner-test-password@127.0.0.1:5432/simulation_dashboard_test
        run: python scripts/harden_postgres_privileges.py
      - name: Verify Alembic current and head
        env:
          DATABASE_URL: postgresql+psycopg://simdashboard_owner:owner-test-password@127.0.0.1:5432/simulation_dashboard_test
        run: |
          python -m alembic -c alembic.ini current
          python -m alembic -c alembic.ini heads
      - name: Verify PostgreSQL app connection contract
        env:
          DATABASE_URL: postgresql+psycopg://simdashboard_app:app-test-password@127.0.0.1:5432/simulation_dashboard_test
        run: python scripts/check_postgres_connection.py
      - name: Seed PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://simdashboard_app:app-test-password@127.0.0.1:5432/simulation_dashboard_test
        run: python scripts/seed_database.py --mode reference
      - name: Run access API tests on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://simdashboard_app:app-test-password@127.0.0.1:5432/simulation_dashboard_test
          ANALYSIS_TEST_POSTGRES: "1"
          ANALYSIS_TEST_POSTGRES_DATABASE: simulation_dashboard_test
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_security.py tests/test_access_policy.py tests/test_assignment_policy.py
          tests/test_directory_memberships.py tests/test_menu_policy.py tests/test_request_work_plans.py
          tests/test_postgres_profile.py tests/test_projects_slice.py tests/test_products_slice.py
          tests/test_results_slice.py tests/test_reports_slice.py tests/test_requests_slice.py
      - name: Create PostgreSQL 0006 upgrade fixture database
        env:
          SIM_DASH_DATABASE: simulation_dashboard_upgrade_test
          SIM_DASH_PRESERVE_EXISTING_ROLES: "1"
        run: python scripts/bootstrap_postgres.py
      - name: Migrate fixture database to 0006
        env:
          DATABASE_URL: postgresql+psycopg://simdashboard_owner:owner-test-password@127.0.0.1:5432/simulation_dashboard_upgrade_test
        run: python -m alembic -c alembic.ini upgrade 0006_batch_attempts
      - name: Reproduce legacy 0006 access shape and data
        env:
          DATABASE_URL: postgresql+psycopg://simdashboard_owner:owner-test-password@127.0.0.1:5432/simulation_dashboard_upgrade_test
        run: python scripts/verify_postgres_0006_access_upgrade.py prepare
      - name: Upgrade fixture database to 0007 and assert backfills
        env:
          DATABASE_URL: postgresql+psycopg://simdashboard_owner:owner-test-password@127.0.0.1:5432/simulation_dashboard_upgrade_test
        run: |
          python -m alembic -c alembic.ini upgrade head
          python scripts/verify_postgres_0006_access_upgrade.py assert

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install backend dependencies
        run: python -m pip install -r ../backend/requirements.lock
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate and build frontend
        run: |
          pnpm run generate:api
          pnpm run check:architecture
          pnpm run test:architecture
          pnpm run test:preferences
          pnpm run test:api
          pnpm run build
      - name: Verify generated API contract
        working-directory: .
        run: git diff --exit-code frontend/openapi.json frontend/src/shared/api/generated/openapi.ts

  frontend-e2e:
    name: Frontend editing E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.lock
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Generate OpenAPI client
        working-directory: frontend
        run: pnpm run generate:api
      - name: Verify generated API contract is committed
        run: git diff --exit-code frontend/openapi.json frontend/src/shared/api/generated/openapi.ts
      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Run editing E2E tests
        working-directory: frontend
        run: pnpm run test:e2e
      - name: Upload Playwright traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 14

  windows-vm-contract:
    name: Windows VM contract
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Security-only Python releases have no python.org Windows installer.
      # Exercise the same pinned uv runtime used by the downloadable deployment.
      - name: Install project runtimes and locked dependencies
        shell: powershell
        run: .\setup.ps1 -NetworkMode direct -SkipFrontendBuild
      - name: Run backend contract tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: >-
          ..\.venv-runtime\Scripts\python.exe -m pytest -q -p no:cacheprovider
          tests/test_access_policy.py tests/test_assignment_policy.py tests/test_directory_memberships.py
          tests/test_menu_policy.py tests/test_oidc_auth.py tests/test_postgres_portability.py tests/test_postgres_startup.py
      - name: Parse PowerShell lifecycle scripts
        shell: powershell
        run: |
          $failed = $false
          git ls-files '*.ps1' '*.psm1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $_), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
      - name: Generate API contract and build frontend
        shell: powershell
        run: |
          Import-Module .\scripts\windows\Runtime.psm1
          Set-ProjectNodePath | Out-Null
          $pnpm = Get-ProjectPnpm
          & $pnpm --dir frontend run generate:api
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $pnpm --dir frontend run build
      - name: Verify generated API contract
        run: git diff --exit-code frontend/openapi.json frontend/src/shared/api/generated/openapi.ts
