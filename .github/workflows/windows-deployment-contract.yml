name: Windows deployment contract

# Run on every source/dependency change: feature work must retain deployment.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-contract:
    name: Server 2022 deployment contract
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Prepare test Python without touching application data
        run: |
          python -m venv .venv-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv-runtime\Scripts\python.exe -m pip install -r backend/requirements.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check Windows PowerShell syntax
        run: |
          $files = @('deploy.ps1', 'start.ps1', 'start-postgresql.ps1', 'stop.ps1', 'update.ps1')
          $files += @(Get-ChildItem scripts/windows,deploy/windows/offline -File | Where-Object { $_.Extension -in @('.ps1', '.psm1') } | ForEach-Object { $_.FullName })
          foreach ($file in $files) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw "PowerShell parse failed in ${file}: $($errors[0].Message)" }
          }
      - name: Verify source deployment and update failure gates
        run: |
          .\scripts\windows\source-postgres-initializer-self-test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\windows\deploy-account-lifecycle-self-test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\windows\update-entry-self-test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify owned process identity and LAN profile
        run: |
          .\scripts\windows\start-stop-identity-self-test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\windows\web-access-self-test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify offline package and installer safety
        run: |
          .\scripts\windows\offline-installer-self-test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\windows\offline-manifest-self-test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\windows\offline-service-guard-self-test.ps1
      - name: Verify database preservation and read-only service startup
        working-directory: backend
        run: |
          ..\.venv-runtime\Scripts\python.exe -m pytest -q `
            tests/test_deployment_schema_gate.py `
            tests/test_deployment_profile.py `
            tests/test_setup_local_postgres_empty_target.py `
            tests/test_offline_deployment_environment.py `
            tests/test_postgres_startup.py `
            tests/test_prepare_account_deployment.py `
            tests/test_prepare_account_deployment_diagnostics.py `
            tests/test_deployment_media_backup.py `
            tests/test_windows_web_access.py
      - name: Verify persistent media and report-template roots
        working-directory: backend
        run: |
          ..\.venv-runtime\Scripts\python.exe -m pytest -q tests/test_media_router_boundary.py tests/test_report_templates_slice.py -k persistent

  offline-wheelhouse:
    name: Locked dependencies install offline on Windows x64
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Collect Windows wheels for every locked dependency
        run: python -m pip download --only-binary=:all: --dest wheelhouse -r backend/requirements.lock
      - name: Install and import using only the collected wheels
        run: |
          python -m venv offline-validation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\offline-validation\Scripts\python.exe -I -m pip --isolated install --no-index --only-binary=:all: --disable-pip-version-check --find-links wheelhouse -r backend/requirements.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\offline-validation\Scripts\python.exe -I -m pip --isolated check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\offline-validation\Scripts\python.exe -I -c "import fastapi,uvicorn,psycopg,sqlalchemy,alembic,duckdb,cryptography,ijson"
