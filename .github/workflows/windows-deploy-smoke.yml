name: Windows one-click deploy smoke

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows-deploy-smoke.yml'
      - '.node-version'
      - '.python-version'
      - '.env.example'
      - 'deploy.bat'
      - 'deploy.ps1'
      - 'deploy/windows/**'
      - 'setup-windows.bat'
      - 'setup.ps1'
      - 'start.bat'
      - 'start.ps1'
      - 'stop.bat'
      - 'stop.ps1'
      - 'update.bat'
      - 'update.ps1'
      - 'scripts/windows/**'
      - 'backend/**'
      - 'frontend/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/windows-deploy-smoke.yml'
      - '.node-version'
      - '.python-version'
      - '.env.example'
      - 'deploy.bat'
      - 'deploy.ps1'
      - 'deploy/windows/**'
      - 'setup-windows.bat'
      - 'setup.ps1'
      - 'start.bat'
      - 'start.ps1'
      - 'stop.bat'
      - 'stop.ps1'
      - 'update.bat'
      - 'update.ps1'
      - 'scripts/windows/**'
      - 'backend/**'
      - 'frontend/**'

permissions:
  contents: read

jobs:
  deploy-smoke:
    name: PowerShell 5.1 clean checkout
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      BACKEND_PORT: '18080'
      FRONTEND_PORT: '15173'
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Verify Windows PowerShell 5.1
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Expected Windows PowerShell 5.1, found $($PSVersionTable.PSVersion)."
          }

      - name: Validate network selection without outbound access
        shell: powershell
        run: .\scripts\windows\network-self-test.ps1

      - name: Validate loopback HTTP proxy isolation
        shell: powershell
        run: .\scripts\windows\local-http-self-test.ps1

      - name: Validate Git updates with disposable local repositories
        shell: powershell
        run: .\scripts\windows\git-update-self-test.ps1

      - name: Validate update stage failures and duplicate runs
        shell: powershell
        run: .\scripts\windows\update-entry-self-test.ps1

      - name: Validate the single-file first-time updater
        shell: powershell
        run: .\scripts\windows\update-bootstrap-self-test.ps1

      - name: Validate the complete updater with real Git and harmless services
        shell: powershell
        run: .\scripts\windows\update-integration-self-test.ps1

      - name: Deploy pinned runtimes and dependencies in direct mode
        shell: powershell
        run: .\deploy.ps1 -NetworkMode direct

      - name: Run the complete managed service lifecycle
        shell: powershell
        run: |
          $backendPort = [int]$env:BACKEND_PORT
          $frontendPort = [int]$env:FRONTEND_PORT
          $databasePath = Join-Path $env:RUNNER_TEMP 'analysis-canvas-windows-smoke.duckdb'
          $startScript = Join-Path $PWD 'start.ps1'
          $stopScript = Join-Path $PWD 'stop.ps1'
          Import-Module (Join-Path $PWD 'scripts\windows\LocalHttp.psm1') -Force
          $startArguments = @(
            '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $startScript,
            '-DatabaseBackend', 'duckdb', '-DuckdbPath', $databasePath,
            '-BackendPort', [string]$backendPort, '-FrontendPort', [string]$frontendPort,
            '-NoBrowser', '-NetworkMode', 'direct'
          )

          function Write-ServiceLogs {
            foreach ($path in @('backend\uvicorn.log', 'backend\uvicorn-error.log', 'frontend\vite.log', 'frontend\vite-error.log')) {
              Write-Host "===== $path ====="
              if (Test-Path -LiteralPath $path -PathType Leaf) { Get-Content -LiteralPath $path -Tail 200 }
              else { Write-Host '(not created)' }
            }
          }

          try {
            & powershell.exe @startArguments
            if ($LASTEXITCODE -ne 0) { throw "Initial start failed with exit code $LASTEXITCODE." }
            $first = Get-Content -Raw -LiteralPath '.server-pids.json' | ConvertFrom-Json

            $backendHealthResponse = Invoke-LocalHttp -Uri "http://127.0.0.1:$backendPort/api/health" -TimeoutMilliseconds 10000
            $backendHealth = $backendHealthResponse.Content | ConvertFrom-Json
            if ($backendHealth.status -ne 'ok' -or $backendHealth.database_backend -ne 'duckdb') {
              throw 'Backend health did not report the disposable DuckDB profile.'
            }
            $web = Invoke-LocalHttp -Uri "http://127.0.0.1:$frontendPort/workspace/overview" -TimeoutMilliseconds 10000
            if ($web.StatusCode -ne 200 -or $web.Content -notmatch '<div id="root">') {
              throw 'The frontend deep route did not serve the application shell.'
            }
            $proxiedHealthResponse = Invoke-LocalHttp -Uri "http://127.0.0.1:$frontendPort/api/health" -TimeoutMilliseconds 10000
            $proxiedHealth = $proxiedHealthResponse.Content | ConvertFrom-Json
            if ($proxiedHealth.status -ne 'ok' -or $proxiedHealth.database_backend -ne 'duckdb') {
              throw 'The frontend API proxy did not target the selected backend port.'
            }

            # start.ps1 exits 0 for a healthy duplicate. Run it in a child host so
            # that exit does not terminate this enclosing lifecycle verification.
            & powershell.exe @startArguments
            if ($LASTEXITCODE -ne 0) { throw "Duplicate start failed with exit code $LASTEXITCODE." }
            $current = Get-Content -Raw -LiteralPath '.server-pids.json' | ConvertFrom-Json
            if ($first.backend.id -ne $current.backend.id -or $first.frontend.id -ne $current.frontend.id) {
              throw 'A duplicate start replaced an already healthy service process.'
            }
          }
          catch {
            Write-ServiceLogs
            throw
          }
          finally {
            $stopArguments = @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $stopScript, '-BackendPort', [string]$backendPort, '-FrontendPort', [string]$frontendPort)
            & powershell.exe @stopArguments
            if ($LASTEXITCODE -ne 0) {
              Write-ServiceLogs
              throw "Managed stop failed with exit code $LASTEXITCODE."
            }
          }

          if (Test-Path -LiteralPath '.server-pids.json') {
            throw 'The managed PID file remained after stop.'
          }
          foreach ($port in @($backendPort, $frontendPort)) {
            $listener = Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue
            if ($listener) {
              Write-ServiceLogs
              throw "A managed listener remained on port $port after stop."
            }
          }
